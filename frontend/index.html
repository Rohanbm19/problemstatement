<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TwinStock AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- removed language switcher from landing page -->

    <button id="themeToggle" class="theme-toggle floating" title="Toggle theme">🌙</button>



    <!-- MAIN CENTER CONTENT -->

    <div class="landing-container">


        <!-- BRAND -->

        <div class="brand">

            <h1>
                TwinStock AI
            </h1>

        </div>



        <!-- ROLE CARD -->

        <div class="role-card">


            <h2 data-i18n="select_role">

                Select Your Role

            </h2>


            <p
                class="role-subtitle"
                data-i18n="role_subtitle">

                Choose how you want to access
                TwinStock AI

            </p>



            <div class="role-options">


                <!-- MANAGER -->

                <button
                    type="button"
                    class="role-button manager-role"
                    onclick="selectRole('manager')">

                    <span class="role-icon">
                        👨‍💼
                    </span>

                    <div>

                        <strong data-i18n="manager">
                            Manager
                        </strong>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- WORKER -->

                <button
                    type="button"
                    class="role-button worker-role"
                    onclick="selectRole('worker')">

                    <span class="role-icon">
                        👷
                    </span>

                    <div>

                        <strong data-i18n="worker">
                            Worker
                        </strong>

                    </div>

                    <span class="arrow">
                        →
                    </span>

                </button>


            </div>

        </div>



        <!-- FOOTER -->

        <p class="footer-text">

            By ByteMe

        </p>


    </div>


    <!-- YOUR JS -->

    <script src="js/theme.js"></script>
    <script src="js/index.js"></script>

</body>

</html>
